[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-intel"
version = "0.1.0"
description = "Institutional-grade stock research intelligence system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mithil", email = "drmithil@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    # Data source clients
    #"convexlib",                    # ConvexValue Python SDK
    "ollama>=0.3.0",                # Local LLM + embeddings (free; replaces Anthropic/Voyage)
    "convexlib @ git+https://github.com/convexvalue/convexlib.git",
    "fredapi>=0.5.0",               # FRED macro data
    "sec-api>=1.0.0",               # SEC EDGAR (optional, free SDK)
    "yfinance>=0.2.40",             # price fallback
    "httpx>=0.27.0",                # for CBOE scraping + generic HTTP

    # Numerical
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",                  # preferred for hot paths
    "scipy>=1.13",
    "scikit-learn>=1.5",            # K-Means for VEGA zones

    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "alembic>=1.13",

    # Scheduling
    "apscheduler>=3.10",

    # Dashboard + API
    "streamlit>=1.36",
    "plotly>=5.22",
    "fastapi>=0.111",               # Phase 6+
    "uvicorn[standard]>=0.30",      # Phase 6+

    # PDF + RAG
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "langchain>=0.2",
    "tiktoken>=0.7",                # for chunk sizing

    # Config + logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",

    # Discord
    "discord-webhook>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.25",
    "freezegun>=1.5",
]

[project.scripts]
trading-intel-scheduler = "trading_intel.scheduler.runner:main"

[tool.setuptools.packages.find]
include = ["trading_intel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ANN", "S", "RUF"]
ignore = ["ANN101", "ANN102", "S101"]   # missing self/cls, asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"alembic/**" = ["ANN", "E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: hits real external services (skipped unless INTEGRATION=1)",
    "slow: takes >5s",
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/", "tests/"]
