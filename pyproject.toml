[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-intel"
version = "0.1.0"
description = "Institutional-grade stock research intelligence system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mithil", email = "drmithil@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    # Data source clients
    #"convexlib",                    # ConvexValue Python SDK
    "ollama>=0.3.0",                # Local LLM + embeddings (free; replaces Anthropic/Voyage)
    "convexlib @ git+https://github.com/convexvalue/convexlib.git",
    "fredapi>=0.5.0",               # FRED macro data
    "sec-api>=1.0.0",               # SEC EDGAR (optional, free SDK)
    "yfinance>=0.2.40",             # price fallback
    "httpx>=0.27.0",                # for CBOE scraping + generic HTTP

    # Numerical
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",                  # preferred for hot paths
    "scipy>=1.13",
    "scikit-learn>=1.5",            # K-Means for VEGA zones
    "ta>=0.11",                     # technical indicators (MACD/Bollinger/ATR) for the MCP technicals tool

    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "alembic>=1.13",

    # Scheduling
    "apscheduler>=3.10",

    # Dashboard + API
    "streamlit>=1.36",
    "plotly>=5.22",
    "openpyxl>=3.1",                # Excel output for the TAS flow analyzer (scripts/tas_analyze.py)
    "fastapi>=0.111",               # Phase 6+
    "uvicorn[standard]>=0.30",      # Phase 6+
    "fastmcp>=2.0",                 # MCP server for Claude Desktop integration

    # PDF + RAG
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",             # Word-doc text extraction (research/*.docx)
    "langchain>=0.2",
    "tiktoken>=0.7",                # for chunk sizing

    # Config + logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",

    # Discord
    "discord-webhook>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.25",
    "freezegun>=1.5",
]

[project.scripts]
trading-intel-scheduler = "trading_intel.scheduler.runner:main"
trading-intel-mcp = "trading_intel.mcp.server:main"

[tool.setuptools.packages.find]
include = ["trading_intel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ANN", "S", "RUF"]
ignore = ["ANN101", "ANN102", "S101"]   # missing self/cls, asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "E501", "RUF001", "RUF002", "RUF003"]
"alembic/**" = ["ANN", "E501"]
# Inline-HTML/plotly report generator: long lines, shorthand locals, and
# intentional typography (γ, Δ, ×, →) in the rendered output are inherent.
"scripts/ticker_report.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
"scripts/iv_tenor_report.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
"scripts/swing_report.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
"scripts/cv_extras.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
"scripts/credit_income_scan.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
"scripts/earnings_inflection.py" = ["ANN", "E501", "N806", "RUF001", "RUF002", "RUF003"]
# HTML/SVG-generating research + digest jobs, and the dense defensive FMP field-mapper —
# inherent long lines / shorthand SVG locals, same as the report generators above.
"trading_intel/scheduler/jobs/research_report.py" = ["E501", "N806", "RUF001", "RUF002", "RUF003"]
"trading_intel/scheduler/jobs/letters_digest.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"trading_intel/synthesis/daily_brief.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"trading_intel/synthesis/daily_brief_render.py" = ["E501", "N806", "RUF001", "RUF002", "RUF003"]
"trading_intel/earnings/alignment.py" = ["RUF001", "RUF002", "RUF003"]
"trading_intel/scheduler/jobs/earnings_alignment.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"trading_intel/research/enrich.py" = ["E501"]
# Jaguar daily-brief lane — inline-HTML renderer, LLM prompts, and typographic glyphs
# (⚡ ⊕ → Δ γ – —) in the rendered brief, same posture as the digest jobs above.
"trading_intel/jaguar/parse.py" = ["RUF001", "RUF002", "RUF003"]
"trading_intel/jaguar/extract.py" = ["RUF001", "RUF002", "RUF003"]
"trading_intel/jaguar/source.py" = ["RUF001", "RUF002", "RUF003"]
"trading_intel/jaguar/structure.py" = ["RUF001", "RUF002", "RUF003"]
"trading_intel/jaguar/brief.py" = ["E501", "ANN401", "RUF001", "RUF002", "RUF003"]
"trading_intel/jaguar/render.py" = ["E501", "N806", "ANN401", "RUF001", "RUF002", "RUF003"]
"trading_intel/market/breadth.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"trading_intel/scheduler/jobs/jaguar_brief.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"scripts/probe_fmp_13f.py" = ["E501", "BLE001", "RUF100"]
"scripts/probe_fmp_fundamentals.py" = ["E501", "BLE001", "RUF100"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: hits real external services (skipped unless INTEGRATION=1)",
    "slow: takes >5s",
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/", "tests/"]
