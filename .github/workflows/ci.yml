name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intel
          POSTGRES_PASSWORD: intel
          POSTGRES_DB: trading_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://intel:intel@localhost:5432/trading_intel
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://intel:intel@localhost:5432/trading_intel
          # Stubs so config validation passes — never use these in real code
          CONVEX_EMAIL: ci@example.com
          CONVEX_PASSWORD: ci-stub
          OLLAMA_HOST: http://localhost:11434
          FRED_API_KEY: ci-stub
          DISCORD_WEBHOOK_URL: https://example.com/webhook
        run: pytest -q --cov=trading_intel --cov-report=term-missing
