name: CI

# 2026-11-14 (O4, code audit C5): tests only. The ruff / black steps were red on every push (thousands of
# old findings: ruff 6,664, black 500 files), so CI never gave a useful signal. The tests need no database
# (integration tests are skipped unless INTEGRATION=1), so the Postgres service + migrations step went too.
# The ship bats run pytest on the laptop before every commit as well.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        env:
          # Stubs so config validation passes — never use these in real code
          CONVEX_EMAIL: ci@example.com
          CONVEX_PASSWORD: ci-stub
          OLLAMA_HOST: http://localhost:11434
          FRED_API_KEY: ci-stub
          DISCORD_WEBHOOK_URL: https://example.com/webhook
        run: pytest -q
